<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VEGA // MESH ROOMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { 
            background-color: #030712; 
            font-family: 'JetBrains Mono', monospace;
            overflow-x: hidden;
        }
        .cyber-border { border: 1px solid rgba(6, 182, 212, 0.3); }
        .cyber-card { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); }
        .message {
            padding: 12px 15px;
            margin: 4px 0;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            border: 1px solid rgba(6, 182, 212, 0.1);
            max-width: 85%;
        }
        .my-message {
            background: rgba(6, 182, 212, 0.15);
            border-color: rgba(6, 182, 212, 0.3);
        }
        .other-message {
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(71, 85, 105, 0.3);
        }
        .message:hover {
            border-color: rgba(6, 182, 212, 0.5);
        }
        .message-actions {
            display: none;
            gap: 8px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(6, 182, 212, 0.2);
            animation: slideDown 0.2s ease-out;
        }
        .message-actions.show {
            display: flex !important;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .action-btn {
            padding: 4px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            font-family: 'JetBrains Mono', monospace;
        }
        .edit-btn { background: #0ea5e9; color: white; }
        .edit-btn:hover { background: #0284c7; }
        .delete-btn { background: #ef4444; color: white; }
        .delete-btn:hover { background: #dc2626; }

        @keyframes glitch {
            0% { text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff; }
            25% { text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff; }
            50% { text-shadow: 2px 2px #ff00ff, -2px -2px #00ffff; }
            75% { text-shadow: -2px 2px #ff00ff, 2px -2px #00ffff; }
            100% { text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff; }
        }
        .admin-glitch {
            animation: glitch 0.3s infinite;
            color: #ff00ff;
            font-weight: bold;
        }
        .admin-glitch::before {
            content: '👑 ';
        }
        .VERA-glitch {
            animation: glitch 0.5s infinite;
            color: #ff00ff;
            font-weight: bold;
        }
        .MILA-glitch {
            animation: glitch 0.4s infinite;
            color: #ff69b4;
            font-weight: bold;
        }
        .MILA-glitch::before {
            content: '🌸 ';
        }
        .call-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .call-container.active {
            display: flex;
        }
        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 90%;
            max-width: 1200px;
            height: 80vh;
        }
        .video-grid.single {
            grid-template-columns: 1fr;
        }
        .video-wrapper {
            position: relative;
            background: #0f172a;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid rgba(6, 182, 212, 0.3);
        }
        .video-wrapper video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .video-label {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #4ade80;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
        }

        .call-controls-top {
            position: fixed;
            top: 20px;
            right: 20px;
            display: none;
            gap: 12px;
            z-index: 10000;
            background: rgba(15, 23, 42, 0.9);
            padding: 12px 20px;
            border-radius: 50px;
            border: 1px solid rgba(6, 182, 212, 0.3);
            backdrop-filter: blur(12px);
            align-items: center;
        }
        .call-controls-top.active {
            display: flex;
        }
        .call-controls-top .call-status {
            color: #4ade80;
            font-size: 12px;
            margin-right: 8px;
        }
        .call-controls-top .call-status.connecting {
            color: #fbbf24;
        }
        .call-btn-top {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e293b;
            color: white;
        }
        .call-btn-top:hover {
            transform: scale(1.1);
        }
        .call-btn-top.mic.muted {
            background: #ef4444;
            color: white;
        }
        .call-btn-top.video.off {
            background: #ef4444;
            color: white;
        }
        .call-btn-top.end {
            background: #ef4444;
            color: white;
            width: 48px;
            height: 48px;
        }
        .call-btn-top.end:hover {
            background: #dc2626;
        }
        .call-btn-top.screen {
            background: #1e293b;
            color: white;
        }
        .call-btn-top.screen.active {
            background: #22c55e;
            color: white;
        }

        .incoming-call {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0f172a;
            padding: 40px;
            border-radius: 20px;
            border: 2px solid rgba(6, 182, 212, 0.3);
            z-index: 10001;
            display: none;
            text-align: center;
            min-width: 300px;
        }
        .incoming-call.active {
            display: block;
        }
        .incoming-call h3 {
            color: #22d3ee;
            margin-bottom: 20px;
        }
        .incoming-call .caller {
            color: #4ade80;
            font-size: 18px;
            margin-bottom: 20px;
        }
        .incoming-call .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .incoming-call .answer-btn {
            background: #22c55e;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .incoming-call .answer-btn:hover {
            background: #16a34a;
        }
        .incoming-call .reject-btn {
            background: #ef4444;
            color: white;
            padding: 10px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .incoming-call .reject-btn:hover {
            background: #dc2626;
        }

        .call-timer {
            color: #94a3b8;
            font-size: 13px;
            font-variant-numeric: tabular-nums;
            min-width: 60px;
            text-align: center;
        }

        .favorite-rooms {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }
        .favorite-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(6, 182, 212, 0.2);
            color: #67e8f9;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'JetBrains Mono', monospace;
        }
        .favorite-btn:hover {
            background: rgba(6, 182, 212, 0.2);
            border-color: rgba(6, 182, 212, 0.5);
        }
        .favorite-btn.active {
            background: rgba(6, 182, 212, 0.3);
            border-color: #06b6d4;
        }
        .favorite-btn .remove-fav {
            margin-left: 4px;
            color: #ef4444;
            opacity: 0.6;
        }
        .favorite-btn .remove-fav:hover {
            opacity: 1;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .incoming-call .caller {
            animation: pulse 1.5s ease-in-out infinite;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-dot.online {
            background: #22c55e;
        }
        .status-dot.offline {
            background: #ef4444;
        }
        .status-dot.connecting {
            background: #fbbf24;
            animation: pulse 1s ease-in-out infinite;
        }

        /* ===== САКУРА - ПАДАЮЩИЕ ЛЕПЕСТКИ ===== */
        .sakura-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            top: -10%;
            width: 28px;
            height: 28px;
            background: radial-gradient(circle at 30% 30%, #ffd9e6, #ff8eb5);
            border-radius: 50% 0 50% 50%;
            opacity: 0.75;
            transform-origin: center;
            box-shadow: 0 0 15px rgba(255, 120, 180, 0.3);
            animation: fall linear infinite;
            will-change: transform, left, top;
            filter: drop-shadow(0 4px 6px rgba(255, 80, 150, 0.2));
        }

        .petal:nth-child(odd) {
            background: radial-gradient(circle at 30% 30%, #ffd0e0, #ff7aa5);
            width: 22px;
            height: 22px;
        }

        .petal:nth-child(3n) {
            background: radial-gradient(circle at 20% 40%, #ffc0d5, #ff5f96);
            width: 32px;
            height: 32px;
            opacity: 0.6;
        }

        .petal:nth-child(5n+2) {
            background: radial-gradient(circle at 60% 20%, #ffe0ed, #ff99bb);
            width: 18px;
            height: 18px;
        }

        .petal::after {
            content: '';
            position: absolute;
            top: 8%;
            left: 18%;
            width: 30%;
            height: 20%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.5) 0%, transparent 80%);
            border-radius: 50%;
            opacity: 0.5;
            transform: rotate(-20deg);
        }

        @keyframes fall {
            0% {
                transform: translateX(0px) rotate(0deg) scale(0.9);
                opacity: 0.7;
            }
            10% {
                opacity: 1;
            }
            85% {
                opacity: 0.9;
            }
            100% {
                transform: translateX(var(--drift, 40px)) rotate(720deg) scale(1.1);
                opacity: 0.2;
                top: 110%;
            }
        }

        /* Делаем чат поверх сакуры */
        .chat-wrapper {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 80rem;
            margin: 0 auto;
            padding: 0.75rem;
            width: 100%;
        }

        /* Небольшое свечение в углу */
        .glow-orb {
            position: fixed;
            width: 80vmax;
            height: 80vmax;
            background: radial-gradient(circle at center, rgba(255, 150, 200, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- ===== САКУРА - ФОН С ЛЕПЕСТКАМИ ===== -->
    <div class="glow-orb"></div>
    <div class="sakura-container" id="sakuraContainer"></div>

    <!-- ===== ОСНОВНОЙ ЧАТ ===== -->
    <div class="chat-wrapper">

        <header class="flex justify-between items-center pb-2 border-b border-cyan-900/50 mb-3">
            <h1 class="text-lg font-bold text-cyan-300 tracking-widest">VEGA//MESH</h1>
            <div class="flex items-center gap-3">
                <span class="text-xs text-slate-500">E2EE ENCRYPTED CHAT</span>
                <span id="connectionStatus" class="flex items-center text-xs">
                    <span class="status-dot offline" id="statusDot"></span>
                    <span id="statusText" class="text-slate-500">Отключено</span>
                </span>
            </div>
        </header>

        <div class="mb-2">
            <div class="flex items-center gap-2 mb-1">
                <span class="text-[10px] text-slate-500">⭐ ИЗБРАННЫЕ КОМНАТЫ:</span>
                <button onclick="addCurrentRoomToFavorites()" class="text-[10px] bg-cyan-950 hover:bg-cyan-900 text-cyan-300 border border-cyan-800 px-2 py-0.5 rounded transition">
                    + Добавить текущую
                </button>
            </div>
            <div id="favoriteRooms" class="favorite-rooms"></div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-3 cyber-card p-3 rounded-xl cyber-border">
            <div>
                <label class="text-[10px] text-slate-500 block mb-1">КОМНАТА:</label>
                <input type="text" id="roomInput" value="main-room" class="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1 text-xs text-cyan-200 focus:outline-none focus:border-cyan-500">
            </div>
            <div>
                <label class="text-[10px] text-slate-500 block mb-1">ИМЯ:</label>
                <input type="text" id="nickInput" value="Agent_X" class="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1 text-xs text-cyan-200 focus:outline-none focus:border-cyan-500">
            </div>
            <div>
                <label class="text-[10px] text-slate-500 block mb-1">КЛЮЧ:</label>
                <input type="password" id="secretKey" placeholder="Секретный пароль..." class="w-full bg-slate-950 border border-slate-800 rounded px-2.5 py-1 text-xs text-cyan-200 focus:outline-none focus:border-cyan-500">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-2 mb-3">
            <button onclick="connectToRoom()" id="connectBtn" class="w-full bg-cyan-950 hover:bg-cyan-900 text-cyan-300 border border-cyan-800 text-xs py-1.5 rounded-lg transition font-bold">
                🔄 ПОДКЛЮЧИТЬСЯ
            </button>
            <button onclick="startCall()" id="startCallBtn" class="w-full bg-green-950 hover:bg-green-900 text-green-300 border border-green-800 text-xs py-1.5 rounded-lg transition font-bold">
                📞 НАЧАТЬ ЗВОНОК
            </button>
        </div>

        <button id="notifyBtn" class="mb-3 w-full bg-cyan-950 hover:bg-cyan-900 text-cyan-300 border border-cyan-800 text-xs py-1.5 rounded-lg transition font-bold">
            Включить уведомления
        </button>

        <div id="messages" class="flex-1 overflow-y-auto space-y-3 p-4 cyber-card rounded-xl cyber-border mb-3">
            <div class="text-xs text-slate-600 border-b border-slate-900 pb-2">[SYSTEM]: Введите комнату и нажмите «Подключиться».</div>
        </div>

        <div class="cyber-card p-3 rounded-xl cyber-border space-y-2">
            <div class="flex gap-2 text-xs">
                <label class="bg-slate-950 hover:bg-slate-900 border border-cyan-900/60 px-3 py-1 rounded cursor-pointer text-cyan-300">
                    📎 Медиа
                    <input type="file" id="fileInput" class="hidden" accept="image/*,video/*">
                </label>
                <button id="recordBtn" onclick="toggleVoiceRecord()" class="bg-slate-950 hover:bg-slate-900 border border-cyan-900/60 px-3 py-1 rounded text-cyan-300">
                    🎙️ <span id="recordText">Голос</span>
                </button>
            </div>

            <form id="chatForm" class="flex gap-2">
                <input type="text" id="messageInput" placeholder="Сообщение..." class="flex-1 bg-slate-950 border border-cyan-900/80 rounded-lg px-4 py-2 text-cyan-100 text-sm focus:outline-none focus:border-cyan-400">
                <button type="submit" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-6 py-2 rounded-lg text-sm">SEND</button>
            </form>
        </div>

    </div>

    <!-- ===== ВИДЕО-ЗВОНОК ===== -->
    <div id="callContainer" class="call-container">
        <div class="video-grid" id="videoGrid">
            <div class="video-wrapper" id="localVideoWrapper">
                <video id="localVideo" autoplay playsinline muted></video>
                <div class="video-label">Вы</div>
            </div>
            <div class="video-wrapper" id="remoteVideoWrapper">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-label" id="remoteLabel">Собеседник</div>
            </div>
        </div>
    </div>

    <div id="callControlsTop" class="call-controls-top">
        <span class="call-status" id="callStatus">📞 В звонке</span>
        <span class="call-timer" id="callTimer">00:00</span>
        <button class="call-btn-top mic" id="micBtnTop" onclick="toggleMic()">🎤</button>
        <button class="call-btn-top video" id="videoBtnTop" onclick="toggleVideo()">📹</button>
        <button class="call-btn-top screen" id="screenBtnTop" onclick="toggleScreenShare()">🖥️</button>
        <button class="call-btn-top end" onclick="endCall()">📞</button>
    </div>

    <div id="incomingCall" class="incoming-call">
        <h3>📞 Входящий звонок</h3>
        <div class="caller" id="callerName">Аноним</div>
        <div class="buttons">
            <button class="answer-btn" onclick="answerCall()">Ответить</button>
            <button class="reject-btn" onclick="rejectCall()">Отклонить</button>
        </div>
    </div>

    <div id="editModal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7);">
        <div style="background: #0f172a; margin: 15% auto; padding: 25px; border-radius: 12px; max-width: 500px; width: 90%; border: 1px solid rgba(6, 182, 212, 0.3);">
            <h3 style="color: #22d3ee; margin-top: 0;">✏️ Редактировать сообщение</h3>
            <textarea id="editInput" rows="3" style="width: 100%; padding: 10px; border: 1px solid #1e293b; border-radius: 6px; background: #020617; color: #a5f3fc; font-size: 14px; resize: vertical; min-height: 80px; margin: 10px 0;"></textarea>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button onclick="closeEdit()" style="padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; background: #1e293b; color: #94a3b8;">Отмена</button>
                <button onclick="saveEdit()" style="padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; background: #0ea5e9; color: white;">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        // ===== ГЕНЕРАЦИЯ САКУРЫ =====
        (function createSakura() {
            const container = document.getElementById('sakuraContainer');
            const PETAL_COUNT = 55;

            function createPetal() {
                const petal = document.createElement('div');
                petal.classList.add('petal');

                const leftPos = Math.random() * 100;
                petal.style.left = leftPos + '%';

                const duration = 8 + Math.random() * 12;
                petal.style.animationDuration = duration + 's';

                const delay = Math.random() * 18;
                petal.style.animationDelay = delay + 's';

                const drift = (Math.random() * 160) - 80;
                petal.style.setProperty('--drift', drift + 'px');

                const sizeScale = 0.6 + Math.random() * 1.0;
                const baseSize = 26;
                const newSize = baseSize * sizeScale;
                petal.style.width = newSize + 'px';
                petal.style.height = newSize + 'px';

                if (Math.random() > 0.6) {
                    petal.style.borderRadius = '40% 0 60% 40%';
                } else {
                    petal.style.borderRadius = '50% 0 50% 50%';
                }

                petal.style.opacity = 0.4 + Math.random() * 0.5;

                return petal;
            }

            for (let i = 0; i < PETAL_COUNT; i++) {
                const petal = createPetal();
                container.appendChild(petal);
            }

            // Добавляем ещё немного для густоты
            for (let i = 0; i < 15; i++) {
                const petal = createPetal();
                petal.style.animationDelay = (Math.random() * 22) + 's';
                container.appendChild(petal);
            }
        })();

        // ===== ОСНОВНАЯ ЛОГИКА ЧАТА =====
        let ws;
        const messagesDiv = document.getElementById('messages');
        const form = document.getElementById('chatForm');
        const input = document.getElementById('messageInput');
        const secretKeyInput = document.getElementById('secretKey');
        const roomInput = document.getElementById('roomInput');
        const nickInput = document.getElementById('nickInput');
        const connectBtn = document.getElementById('connectBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');

        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;
        let isRecordingCanceled = false;
        let heartbeatInterval = null;
        let reconnectTimer = null;
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 5;
        let isManuallyDisconnected = false;
        let initialConnectAttempted = false;

        const STORAGE_KEYS = {
            CHAT_HISTORY: 'vega_chat_history',
            FAVORITE_ROOMS: 'vega_favorite_rooms',
            SESSION: 'vega_session'
        };

        // ===== ВИДЕО-ЗВОНОК =====
        let peerConnection = null;
        let localStream = null;
        let remoteStream = null;
        let screenStream = null;
        let isCallActive = false;
        let isIncomingCall = false;
        let callTarget = null;
        let isMicMuted = false;
        let isVideoOff = false;
        let isScreenSharing = false;
        let callTimerInterval = null;
        let callStartTime = null;
        let currentRoom = '';
        let pendingCandidates = [];

        const callContainer = document.getElementById('callContainer');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const videoGrid = document.getElementById('videoGrid');
        const incomingCallDiv = document.getElementById('incomingCall');
        const callerNameSpan = document.getElementById('callerName');
        const callControlsTop = document.getElementById('callControlsTop');
        const callStatus = document.getElementById('callStatus');
        const callTimer = document.getElementById('callTimer');
        const startCallBtn = document.getElementById('startCallBtn');

        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // ===== УПРАВЛЕНИЕ СТАТУСОМ =====
        function updateConnectionStatus(status, message) {
            statusDot.className = 'status-dot ' + status;
            statusText.textContent = message;

        // ===== СЕССИЯ =====
        function saveSession(room, nick, secret) {
            try {
                const session = {
                    room: room,
                    nick: nick,
                    secret: secret,
                    timestamp: Date.now(),
                    expires: Date.now() + 24 * 60 * 60 * 1000
                };
                localStorage.setItem(STORAGE_KEYS.SESSION, JSON.stringify(session));
            } catch (e) {
                console.error('Ошибка сохранения сессии:', e);
            }
        }

        function loadSession() {
            try {
                const session = JSON.parse(localStorage.getItem(STORAGE_KEYS.SESSION) || 'null');
                if (session && session.expires > Date.now()) {
                    return session;
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        function restoreSession() {
            const session = loadSession();
            if (session) {
                roomInput.value = session.room;
                nickInput.value = session.nick;
                secretKeyInput.value = session.secret;
                appendSystemMessage(`🔄 Восстановлена сессия для комнаты "${session.room}"`);
                connectToRoom();
                return true;
            }
            return false;
        }

        // ===== ПОДКЛЮЧЕНИЕ К КОМНАТЕ =====
        function connectToRoom() {
            const room = roomInput.value.trim() || 'main-room';
            currentRoom = room;

            saveSession(room, nickInput.value, secretKeyInput.value);
            displayChatHistory(room);

            if (ws) {
                clearInterval(heartbeatInterval);
                isManuallyDisconnected = true;
                ws.close();
                ws = null;
            }

            isManuallyDisconnected = false;
            updateConnectionStatus('connecting', 'Подключение...');
            connectBtn.disabled = true;
            connectBtn.textContent = '⏳ ПОДКЛЮЧЕНИЕ...';

            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws/${room}`);

            ws.onopen = () => {
                clearInterval(heartbeatInterval);
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
                reconnectAttempts = 0;
                isManuallyDisconnected = false;
                initialConnectAttempted = true;

                heartbeatInterval = setInterval(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({ type: 'ping' }));
                    }
                }, 25000);

                updateConnectionStatus('online', 'Подключено');
                connectBtn.disabled = false;
                connectBtn.textContent = '🔄 ПОДКЛЮЧИТЬСЯ';
                appendSystemMessage(`Подключено к комнате: ${room}`);
                renderFavoriteRooms();
            };

            ws.onmessage = async (event) => {
                const secret = secretKeyInput.value || "default";
                const payload = JSON.parse(event.data);

                if (payload.type === 'pong') return;

                if (payload.type === 'call_signal') {
                    handleCallSignal(payload);
                    return;
                }

                if (payload.type === 'delete') {
                    const el = document.getElementById(`msg-${payload.msgId}`);
                    if (el) {
                        const parent = el.closest('.flex');
                        if (parent) {
                            parent.style.transition = 'opacity 0.3s';
                            parent.style.opacity = '0';
                            setTimeout(() => {
                                if (parent.parentNode) {
                                    parent.remove();
                                }
                            }, 300);
                        }
                        const history = loadChatHistory(currentRoom);
                        const updatedHistory = history.filter(msg => msg.id !== payload.msgId);
                        saveChatHistory(currentRoom, updatedHistory);
                    }
                    return;
                }

                if (payload.type === 'edit') {
                    const el = document.getElementById(`msg-${payload.msgId}`);
                    if (el && payload.data) {
                        const decryptedBuffer = await decryptData(payload.data, secret);
                        if (decryptedBuffer) {
                            const text = new TextDecoder().decode(decryptedBuffer);
                            const textSpan = el.querySelector('.message-text');
                            if (textSpan) {
                                textSpan.textContent = text;
                                el.style.transition = 'background 0.3s';
                                el.style.background = 'rgba(250, 204, 21, 0.2)';
                                setTimeout(() => {
                                    el.style.background = '';
                                }, 500);

                                const history = loadChatHistory(currentRoom);
                                const msgIndex = history.findIndex(msg => msg.id === payload.msgId);
                                if (msgIndex > -1) {
                                    history[msgIndex].text = text;
                                    saveChatHistory(currentRoom, history);
                                }
                            }
                        }
                    }
                    return;
                }

                const decryptedBuffer = await decryptData(payload.data, secret);
                let senderNick = payload.sender || "Аноним";
                senderNick = applySecretNicks(senderNick);
                const myNick = applySecretNicks(nickInput.value);
                const isMyMessage = senderNick === myNick;

                if (!decryptedBuffer) {
                    appendElement("Ошибка расшифровки", senderNick, isMyMessage);
                    return;
                }

                const msgId = payload.msgId || Date.now() + '_' + Math.random().toString(36).substr(2, 9);

                if (payload.type === 'text') {
                    const text = new TextDecoder().decode(decryptedBuffer);
                    appendElement(text, senderNick, isMyMessage, true, msgId);

                    const history = loadChatHistory(currentRoom);
                    const exists = history.some(msg => msg.id === msgId);
                    if (!exists) {
                        history.push({
                            id: msgId,
                            type: 'text',
                            text: text,
                            sender: senderNick,
                            timestamp: Date.now()
                        });
                        saveChatHistory(currentRoom, history);
                    }

                } else if (payload.type === 'image') {
                    const blob = new Blob([decryptedBuffer]);
                    appendMediaElement('img', URL.createObjectURL(blob), senderNick, isMyMessage, msgId);
                } else if (payload.type === 'video') {
                    const blob = new Blob([decryptedBuffer]);
                    appendMediaElement('video', URL.createObjectURL(blob), senderNick, isMyMessage, msgId);
                } else if (payload.type === 'audio') {
                    const blob = new Blob([decryptedBuffer], { type: 'audio/webm' });
                    appendMediaElement('audio', URL.createObjectURL(blob), senderNick, isMyMessage, msgId);
                } else {
                    if (payload.type !== 'file') {
                        return;
                    }
                    const blob = new Blob([decryptedBuffer]);
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = payload.fileName || 'file';
                    link.innerText = `📄 Скачать ${payload.fileName || 'файл'}`;
                    link.className = "underline text-cyan-300 block my-1";
                    const wrap = document.createElement('div');
                    wrap.className = isMyMessage ? 'flex justify-end' : 'flex justify-start';
                    const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
                    const div = document.createElement('div');
                    div.id = `msg-${msgId}`;
                    div.className = `message ${isMyMessage ? 'my-message' : 'other-message'}`;
                    div.dataset.msgId = msgId;
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'message-content';
                    const senderSpan = document.createElement('div');
                    senderSpan.className = 'sender-name';
                    senderSpan.textContent = senderNick || 'Аноним';
                    senderSpan.style.fontSize = '10px';
                    senderSpan.style.color = '#4ade80';
                    senderSpan.style.marginBottom = '4px';
                    if (senderNick === 'Anatoliy(Admin)') {
                        senderSpan.classList.add('admin-glitch');
                    } else if (senderNick === '(мяу) ღ💔𝓥𝓔𝓡𝓐💔ღ (мяу)') {
                        senderSpan.classList.add('VERA-glitch');
                    } else if (senderNick === '꧁༺🌸 𝕄𝕚𝕝𝕒 🌸༻꧂') {
                        senderSpan.classList.add('MILA-glitch');
                    }
                    const fileDiv = document.createElement('div');
                    fileDiv.appendChild(link);
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'timestamp';
                    timeSpan.textContent = time;
                    timeSpan.style.fontSize = '10px';
                    timeSpan.style.color = '#64748b';
                    timeSpan.style.display = 'block';
                    timeSpan.style.marginTop = '4px';
                    contentDiv.appendChild(senderSpan);
                    contentDiv.appendChild(fileDiv);
                    contentDiv.appendChild(timeSpan);
                    const actionsDiv = document.createElement('div');
                    actionsDiv.className = 'message-actions';
                    actionsDiv.style.display = 'none';
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'action-btn delete-btn';
                    deleteBtn.innerHTML = '🗑️ Удалить';
                    deleteBtn.onclick = function (e) {
                        e.stopPropagation();
                        deleteMessage(msgId);
                    };
                    actionsDiv.appendChild(deleteBtn);
                    div.appendChild(contentDiv);
                    div.appendChild(actionsDiv);
                    div.addEventListener('click', function (e) {
                        if (e.target.closest('.action-btn')) return;
                        toggleActions(msgId);
                    });
                    wrap.appendChild(div);
                    messagesDiv.appendChild(wrap);
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    const history = loadChatHistory(currentRoom);
                    const exists = history.some(msg => msg.id === msgId);
                    if (!exists) {
                        history.push({
                            id: msgId,
                            type: 'file',
                            text: payload.fileName || 'file',
                            sender: senderNick,
                            timestamp: Date.now()
                        });
                        saveChatHistory(currentRoom, history);
                    }
                }
            };

            ws.onclose = () => {
                clearInterval(heartbeatInterval);
                if (!isManuallyDisconnected) {
                    updateConnectionStatus('offline', 'Отключено');
                    connectBtn.disabled = false;
                    connectBtn.textContent = '🔄 ПОДКЛЮЧИТЬСЯ';
                }

                if (!isManuallyDisconnected && reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                    reconnectAttempts++;
                    if (reconnectTimer) {
                        clearTimeout(reconnectTimer);
                    }
                    reconnectTimer = setTimeout(() => {
                        if (!ws || ws.readyState !== WebSocket.OPEN) {
                            attemptReconnect();
                        }
                    }, 3000);
                } else if (!isManuallyDisconnected) {
                    appendSystemMessage('❌ Не удалось подключиться к серверу!');
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                appendSystemMessage('⚠️ Ошибка соединения');
                updateConnectionStatus('offline', 'Ошибка');
                connectBtn.disabled = false;
                connectBtn.textContent = '🔄 ПОДКЛЮЧИТЬСЯ';
            };
        }

        function attemptReconnect() {
            if (reconnectTimer) {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }

            if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS && !isManuallyDisconnected) {
                reconnectAttempts++;
                appendSystemMessage(`🔄 Переподключение... (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`);
                updateConnectionStatus('connecting', `Переподключение... ${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS}`);
                reconnectTimer = setTimeout(() => {
                    if (!ws || ws.readyState !== WebSocket.OPEN) {
                        connectToRoom();
                    }
                }, 3000);
            } else {
                appendSystemMessage('❌ Максимальное число попыток переподключения исчерпано');
                updateConnectionStatus('offline', 'Отключено');
                connectBtn.disabled = false;
                connectBtn.textContent = '🔄 ПОДКЛЮЧИТЬСЯ';
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    if (!isManuallyDisconnected) {
                        reconnectAttempts = 0;
                        connectToRoom();
                    }
                }
            }
        });

        // ===== CRYPTO HELPERS =====
        async function getCryptoKey(secret) {
            const enc = new TextEncoder();
            return await crypto.subtle.importKey(
                "raw", enc.encode(secret.padEnd(32, '0').slice(0, 32)),
                "AES-GCM", false, ["encrypt", "decrypt"]
            );
        }

        async function encryptData(arrayBuffer, secret) {
            const key = await getCryptoKey(secret);
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, arrayBuffer);
            const combined = new Uint8Array(iv.length + ciphertext.byteLength);
            combined.set(iv, 0);
            combined.set(new Uint8Array(ciphertext), iv.length);

            let binary = '';
            const bytes = new Uint8Array(combined);
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        async function decryptData(base64Data, secret) {
            try {
                const key = await getCryptoKey(secret);
                const binary = atob(base64Data);
                const bytes = new Uint8Array(binary.length);
                for (let i = 0; i < binary.length; i++) {
                    bytes[i] = binary.charCodeAt(i);
                }
                const iv = bytes.slice(0, 12);
                const data = bytes.slice(12);
                return await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
            } catch (e) {
                return null;
            }
        }

            ws.send(JSON.stringify({

        async function toggleVoiceRecord() {
            const recordBtn = document.getElementById('recordBtn');
            const recordText = document.getElementById('recordText');

            if (!isRecording) {
                try {
                    isRecordingCanceled = false;
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = async () => {
                        if (isRecordingCanceled) {
                            audioChunks = [];
                            if (mediaRecorder && mediaRecorder.stream) {
                                mediaRecorder.stream.getTracks().forEach(t => t.stop());
                            }
                            return;
                        }

                        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const arrayBuffer = await audioBlob.arrayBuffer();
                        const secret = secretKeyInput.value || "default";
                        const encrypted = await encryptData(arrayBuffer, secret);
                        const msgId = Date.now() + '_' + Math.random().toString(36).substr(2, 9);

                        const myNick = applySecretNicks(nickInput.value);
                        ws.send(JSON.stringify({
                            sender: nickInput.value,
                            type: 'audio',
                            data: encrypted,
                            msgId: msgId
                        }));

                        const url = URL.createObjectURL(audioBlob);
                        appendMediaElement('audio', url, myNick, true, msgId);
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordText.innerText = "ЗАПИСЬ...";
                    recordBtn.classList.add('border-red-500', 'text-red-400');
                } catch (e) {
                    alert("Нужен HTTPS или localhost!");
                }
            } else {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
                if (mediaRecorder && mediaRecorder.stream) {
                    mediaRecorder.stream.getTracks().forEach(t => t.stop());
                }
                isRecording = false;
                recordText.innerText = "Голос";
                recordBtn.classList.remove('border-red-500', 'text-red-400');
            }
        }

        function sendCallSignal(signal) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                console.log('Отправка сигнала:', signal.type);
                ws.send(JSON.stringify({
                    type: 'call_signal',
                    signal: signal,
                    sender: nickInput.value,
                    target: 'all'
                }));
            }

        function handleCallSignal(payload) {
            const signal = payload.signal;
            const sender = payload.sender;

            if (sender === nickInput.value) {
                console.log('Пропускаем свой сигнал');
                return;
            }

            console.log('Получен сигнал:', signal.type, 'от', sender);

            switch (signal.type) {
                case 'offer':
                    if (!isCallActive && !isIncomingCall) {
                        console.log('Получен offer от', sender);
                        isIncomingCall = true;
                        callTarget = sender;
                        callerNameSpan.textContent = sender;
                        incomingCallDiv.classList.add('active');
                        appendSystemMessage(`📞 Входящий звонок от ${sender}`);

                        if (!peerConnection) {
                            peerConnection = new RTCPeerConnection(configuration);

                            peerConnection.onicecandidate = (event) => {
                                if (event.candidate) {
                                    console.log('Отправка ICE кандидата');
                                    sendCallSignal({
                                        type: 'ice',
                                        candidate: event.candidate
                                    });
                                }
                            };

                            peerConnection.oniceconnectionstatechange = () => {
                                console.log('ICE состояние:', peerConnection.iceConnectionState);
                                if (peerConnection.iceConnectionState === 'connected') {
                                    callStatus.textContent = '📞 В звонке';
                                    callStatus.className = 'call-status';
                                    if (!callTimerInterval) {
                                        callStartTime = Date.now();
                                        callTimerInterval = setInterval(updateCallTimer, 1000);
                                    }
                                } else if (peerConnection.iceConnectionState === 'disconnected' ||
                                           peerConnection.iceConnectionState === 'failed') {
                                    appendSystemMessage('⚠️ Соединение разорвано');
                                    endCall();
                                }
                            };

                            peerConnection.ontrack = (event) => {
                                console.log('Получен трек от собеседника');
                                if (!remoteStream) {
                                    remoteStream = new MediaStream();
                                    remoteVideo.srcObject = remoteStream;
                                }
                                remoteStream.addTrack(event.track);
                            };

                            if (!remoteStream) {
                                remoteStream = new MediaStream();
                                remoteVideo.srcObject = remoteStream;
                            }
                        }

                        try {
                            peerConnection.setRemoteDescription(new RTCSessionDescription(signal.sdp));
                            console.log('Remote description установлен');
                        } catch (e) {
                            console.error('Ошибка установки remote description:', e);
                        }
                    }
                    break;

                case 'answer':
                    console.log('Получен answer от', sender);
                    if (peerConnection && isCallActive) {
                        try {
                            peerConnection.setRemoteDescription(new RTCSessionDescription(signal.sdp));
                            console.log('Remote description (answer) установлен');
                            appendSystemMessage('✅ Звонок принят!');
                            incomingCallDiv.classList.remove('active');
                            callStatus.textContent = '📞 В звонке';
                            callStatus.className = 'call-status';
                            if (!callTimerInterval) {
                                callStartTime = Date.now();
                                callTimerInterval = setInterval(updateCallTimer, 1000);
                            }
                        } catch (e) {
                            console.error('Ошибка установки answer:', e);
                        }
                    }
                    break;

                case 'ice':
                    if (peerConnection) {
                        try {
                            console.log('Добавление ICE кандидата');
                            peerConnection.addIceCandidate(new RTCIceCandidate(signal.candidate));
                        } catch (e) {
                            console.warn('Ошибка добавления ICE кандидата:', e);
                        }
                    } else {
                        console.warn('peerConnection не существует для ICE кандидата');
                    }
                    break;

                case 'hangup':
                    appendSystemMessage(`📞 ${sender} завершил(а) звонок`);
                    endCall();
                    break;
            }
        }

        async function startCall() {
            if (isCallActive) {
                appendSystemMessage('⚠️ Звонок уже активен');
                return;
            }

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                appendSystemMessage('⚠️ Сначала подключитесь к комнате');
                return;
            }

            try {
                console.log('Начинаем звонок...');

                const devices = await navigator.mediaDevices.enumerateDevices();
                const hasCamera = devices.some(device => device.kind === 'videoinput');

                if (hasCamera) {
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia({
                            video: true,
                            audio: true
                        });
                    } catch (cameraError) {
                        console.warn('Камера недоступна, используем только аудио:', cameraError);
                        localStream = await navigator.mediaDevices.getUserMedia({
                            audio: true
                        });
                        appendSystemMessage('🎥 Камера недоступна, звонок только с аудио');
                    }
                } else {
                    localStream = await navigator.mediaDevices.getUserMedia({
                        audio: true
                    });
                    appendSystemMessage('🎥 Камера не найдена, звонок только с аудио');
                }

                localVideo.srcObject = localStream;

                peerConnection = new RTCPeerConnection(configuration);

                peerConnection.onicecandidate = (event) => {
                    if (event.candidate) {
                        console.log('Отправка ICE кандидата (offer)');
                        sendCallSignal({
                            type: 'ice',
                            candidate: event.candidate
                        });
                    }
                };

                peerConnection.oniceconnectionstatechange = () => {
                    console.log('ICE состояние (offer):', peerConnection.iceConnectionState);
                    if (peerConnection.iceConnectionState === 'connected') {
                        callStatus.textContent = '📞 В звонке';
                        callStatus.className = 'call-status';
                        if (!callTimerInterval) {
                            callStartTime = Date.now();
                            callTimerInterval = setInterval(updateCallTimer, 1000);
                        }
                    } else if (peerConnection.iceConnectionState === 'disconnected' ||
                               peerConnection.iceConnectionState === 'failed') {
                        appendSystemMessage('⚠️ Соединение разорвано');
                        endCall();
                    }
                };

                peerConnection.ontrack = (event) => {
                    console.log('Получен трек от собеседника (offer)');
                    if (!remoteStream) {
                        remoteStream = new MediaStream();
                        remoteVideo.srcObject = remoteStream;
                    }
                    remoteStream.addTrack(event.track);
                };

                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                console.log('Local description (offer) установлен');

                sendCallSignal({
                    type: 'offer',
                    sdp: offer
                });

                isCallActive = true;
                updateCallUI(true);

                const hasVideo = localStream.getVideoTracks().length > 0;
                if (!hasVideo) {
                    videoGrid.classList.add('single');
                } else {
                    videoGrid.classList.remove('single');
                }

                callStatus.textContent = '📞 Ожидание ответа...';
                callStatus.className = 'call-status connecting';

                appendSystemMessage('📞 Звонок отправлен, ожидание ответа...');

            } catch (error) {
                console.error('Ошибка при начале звонка:', error);
                appendSystemMessage('⚠️ Не удалось начать звонок: ' + error.message);
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                    localStream = null;
                }
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
                isCallActive = false;
                updateCallUI(false);
            }
        }

                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                console.log('Local description (answer) установлен');

                sendCallSignal({
                    type: 'answer',
                    sdp: answer
                });

                isCallActive = true;
                isIncomingCall = false;
                incomingCallDiv.classList.remove('active');
                updateCallUI(true);

                const hasVideo = localStream.getVideoTracks().length > 0;
                if (!hasVideo) {
                    videoGrid.classList.add('single');
                } else {
                    videoGrid.classList.remove('single');
                }

                callStatus.textContent = '📞 В звонке';
                callStatus.className = 'call-status';
                if (!callTimerInterval) {
                    callStartTime = Date.now();
                    callTimerInterval = setInterval(updateCallTimer, 1000);
                }

                appendSystemMessage('📞 Звонок начат');

            } catch (error) {
                console.error('Ошибка при ответе на звонок:', error);
                appendSystemMessage('⚠️ Не удалось ответить на звонок: ' + error.message);
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                    localStream = null;
                }
                isIncomingCall = false;
                incomingCallDiv.classList.remove('active');
                if (peerConnection) {
                    peerConnection.close();
                    peerConnection = null;
                }
            }
        }

        function rejectCall() {
            isIncomingCall = false;
            incomingCallDiv.classList.remove('active');
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            appendSystemMessage('❌ Звонок отклонен');
        }

        function endCall() {
            if (isCallActive) {
                sendCallSignal({ type: 'hangup' });
            }

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            if (localStream) {
                localStream.getTracks().forEach(t => t.stop());
                localStream = null;
            }

            if (screenStream) {
                screenStream.getTracks().forEach(t => t.stop());
                screenStream = null;
                isScreenSharing = false;
                const screenBtn = document.getElementById('screenBtnTop');
                screenBtn.classList.remove('active');
                screenBtn.textContent = '🖥️';
            }

            localVideo.srcObject = null;
            remoteVideo.srcObject = null;
            remoteStream = null;

            isCallActive = false;
            isIncomingCall = false;
            incomingCallDiv.classList.remove('active');
            updateCallUI(false);

            isMicMuted = false;
            isVideoOff = false;
            const micBtn = document.getElementById('micBtnTop');
            const videoBtn = document.getElementById('videoBtnTop');
            micBtn.classList.remove('muted');
            micBtn.textContent = '🎤';
            videoBtn.classList.remove('off');
            videoBtn.textContent = '📹';

            pendingCandidates = [];
            videoGrid.classList.remove('single');
            appendSystemMessage('📞 Звонок завершен');
        }

        function toggleMic() {
            if (!localStream) return;

            const audioTracks = localStream.getAudioTracks();
            if (audioTracks.length > 0) {
                isMicMuted = !isMicMuted;
                audioTracks[0].enabled = !isMicMuted;
                const micBtn = document.getElementById('micBtnTop');
                if (isMicMuted) {
                    micBtn.classList.add('muted');
                    micBtn.textContent = '🔇';
                } else {
                    micBtn.classList.remove('muted');
                    micBtn.textContent = '🎤';
                }
            }
        }

        function toggleVideo() {
            if (!localStream) return;

            const videoTracks = localStream.getVideoTracks();
            if (videoTracks.length > 0) {
                isVideoOff = !isVideoOff;
                videoTracks[0].enabled = !isVideoOff;
                const videoBtn = document.getElementById('videoBtnTop');
                if (isVideoOff) {
                    videoBtn.classList.add('off');
                    videoBtn.textContent = '📹❌';
                } else {
                    videoBtn.classList.remove('off');
                    videoBtn.textContent = '📹';
                }
            }
        }

        async function toggleScreenShare() {
            if (!isCallActive) {
                appendSystemMessage('⚠️ Сначала начните звонок');
                return;
            }

            const screenBtn = document.getElementById('screenBtnTop');

            if (!isScreenSharing) {
                try {
                    screenStream = await navigator.mediaDevices.getDisplayMedia({
                        video: true,
                        audio: false
                    });

                    const videoTrack = screenStream.getVideoTracks()[0];
                    const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) {
                        sender.replaceTrack(videoTrack);
                    }

                    localVideo.srcObject = screenStream;

                    videoTrack.onended = () => {
                        toggleScreenShare();
                    };

                    isScreenSharing = true;
                    screenBtn.classList.add('active');
                    screenBtn.textContent = '🖥️✅';
                    appendSystemMessage('🖥️ Демонстрация экрана начата');
                } catch (error) {
                    console.error('Ошибка при демонстрации экрана:', error);
                    appendSystemMessage('⚠️ Не удалось начать демонстрацию экрана');
                }
            } else {
                if (screenStream) {
                    screenStream.getTracks().forEach(t => t.stop());
                    screenStream = null;
                }

                if (localStream) {
                    const videoTrack = localStream.getVideoTracks()[0];
                    if (videoTrack) {
                        const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) {
                            sender.replaceTrack(videoTrack);
                        }
                    }
                    localVideo.srcObject = localStream;
                }

                isScreenSharing = false;
                screenBtn.classList.remove('active');
                screenBtn.textContent = '🖥️';
                appendSystemMessage('🖥️ Демонстрация экрана остановлена');
            }
        }

        // ===== SERVICE WORKER ДЛЯ УВЕДОМЛЕНИЙ =====
        if ('serviceWorker' in navigator && 'PushManager' in window) {
            navigator.serviceWorker.register('/sw.js')
                .then(async (reg) => {
                    console.log('Service Worker зарегистрирован!', reg);

                    const existingSub = await reg.pushManager.getSubscription();
                    if (existingSub) {
                        document.getElementById('notifyBtn').innerText = '✅ Уведомления активны';
                    }

                    document.getElementById('notifyBtn').onclick = async () => {
                        const permission = await Notification.requestPermission();
                        if (permission === 'granted') {
                            try {
                                const room = roomInput.value.trim() || 'main-room';

                                let sub = await reg.pushManager.getSubscription();
                                if (!sub) {
                                    const vapidKey = 'BC_wVc9umyXQ8uPwJ7HJ0jXeT1BKAubZrLNmgd8rVzgjpVd5mLaHPjYJYA4c-L-2IaclWs_LTJux1nBZQSa9LPs';
                                    sub = await reg.pushManager.subscribe({
                                        userVisibleOnly: true,
                                        applicationServerKey: vapidKey
                                    });
                                }

                                const response = await fetch(`/subscribe/${room}`, {
                                    method: 'POST',
                                    body: JSON.stringify(sub),
                                    headers: { 'Content-Type': 'application/json' }
                                });

                                if (response.ok) {
                                    document.getElementById('notifyBtn').innerText = '✅ Уведомления активны';
                                    appendSystemMessage('🔔 Уведомления включены');
                                } else {
                                    appendSystemMessage('⚠️ Ошибка при включении уведомлений');
                                }
                            } catch (error) {
                                console.error('Ошибка подписки:', error);
                                appendSystemMessage('⚠️ Ошибка при включении уведомлений');
                            }
                        } else {
                            appendSystemMessage('⚠️ Разрешение на уведомления не получено');
                        }
                    };
                })
                .catch(err => console.error('Ошибка SW:', err));
        } else {
            document.getElementById('notifyBtn').innerText = '❌ Уведомления не поддерживаются';
        }

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        nickInput.addEventListener('input', function() {
            let nick = this.value;

            if (nick.includes('159357')) {
                this.value = 'Anatoliy(Admin)';
                appendSystemMessage('👑 Активирован режим администратора!');
                return;
            }

            if (nick.includes('777')) {
                this.value = '(мяу) ღ💔𝓥𝓔𝓡𝓐💔ღ (мяу)';
                appendSystemMessage('🕷️ ЭЛИТНЫЙ НИК VERA активирован!');
                return;
            }

            if (nick.includes('2712')) {
                this.value = '꧁༺🌸 𝕄𝕚𝕝𝕒 🌸༻꧂';
                appendSystemMessage('🌸 Никнейм 𝕄𝕚𝕝𝕒 активирован!');
                return;
            }
        });

        renderFavoriteRooms();

        const restored = restoreSession();
        if (!restored) {
            setTimeout(() => {
                if (!initialConnectAttempted) {
                    connectToRoom();
                }
            }, 500);
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && isCallActive) {
                endCall();
            }
        });

        window.addEventListener('beforeunload', function() {
            if (ws) {
                isManuallyDisconnected = true;
                ws.close();
            }
            if (isCallActive) {
                endCall();
            }
        });

        console.log('🔐 VEGA MESH CHAT загружен!');
        console.log('📞 Для звонка нажмите кнопку "НАЧАТЬ ЗВОНОК"');

        console.log('🕷️ Секретный код для VERA: 777');
        console.log('🌸 Секретный код для Mila: 2712');
    </script>
